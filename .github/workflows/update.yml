name: Update AI Drama Daily

on:
  schedule:
    - cron: "17 11 * * *"   # ~6:17 AM Central (CDT), 5:17 AM in winter
  workflow_dispatch:         # "Run workflow" button for manual refresh

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "ai-drama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
